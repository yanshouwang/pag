name: pag_android
description: "Android implementation of the pag_flutter plugin."
version: 0.0.2
repository: "https://github.com/yanshouwang/pag-flutter"
issue_tracker: "https://github.com/yanshouwang/pag-flutter/issues"
topics:
  - libpag
  - pag

environment:
  sdk: ^3.6.0
  flutter: ">=3.3.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pag_platform_interface: ^0.0.2
  pigeon: ^27.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: pag_flutter
    platforms:
      android:
        package: dev.hebei.pag_android
        pluginClass: PAGAndroidPlugin
        dartPluginClass: PAGAndroidPlugin
