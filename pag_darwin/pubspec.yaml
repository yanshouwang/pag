name: pag_darwin
description: "iOS and macOS implementation of the pag_flutter plugin."
version: 1.0.0
repository: "https://github.com/yanshouwang/pag-flutter"
issue_tracker: "https://github.com/yanshouwang/pag-flutter/issues"
topics:
  - libpag
  - pag

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pag_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^25.3.0

flutter:
  plugin:
    implements: pag_flutter
    platforms:
      ios:
        sharedDarwinSource: true
        pluginClass: PAGDarwinPlugin
        dartPluginClass: PAGiOSPlugin
      macos:
        sharedDarwinSource: true
        pluginClass: PAGDarwinPlugin
        dartPluginClass: PAGmacOSPlugin
